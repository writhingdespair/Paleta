<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF6EF" />
    <meta name="description" content="Elyra — Mexican paletas, made by hand on Route 9W in Highland, NY. Real fruit, real cream, no shortcuts." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet" />
    <title>Elyra — Mexican Paletas, Hand-Made on 9W</title>
    <script>
      (function () {
        try {
          var nav = window.navigator;
          var mq = window.matchMedia;
          var low = false;
          if (mq && mq('(prefers-reduced-motion: reduce)').matches) low = true;
          else if (mq && mq('(prefers-reduced-transparency: reduce)').matches) low = true;
          else if (mq && mq('(update: slow)').matches) low = true;
          else if (typeof nav.deviceMemory === 'number' && nav.deviceMemory < 4) low = true;
          else if (typeof nav.hardwareConcurrency === 'number' && nav.hardwareConcurrency < 4) low = true;
          else if (nav.connection) {
            if (nav.connection.saveData) low = true;
            else if (nav.connection.effectiveType === '2g' || nav.connection.effectiveType === 'slow-2g') low = true;
          }
          if (low) document.documentElement.classList.add('perf-low');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
